name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: |
          set +e
          overall=0
          echo '## Test results & coverage' >> "$GITHUB_STEP_SUMMARY"
          for pkg in shared api web; do
            name="@printlib/$pkg"
            npm run test:coverage -w "$name" > "$pkg-output.raw.txt" 2>&1
            status=$?
            [ "$status" -ne 0 ] && overall=1
            sed -r "s/\x1b\[[0-9;]*[a-zA-Z]//g" "$pkg-output.raw.txt" > "$pkg-output.txt"
            {
              echo ""
              if [ "$status" -eq 0 ]; then
                echo "<details><summary>✅ $name</summary>"
              else
                echo "<details open><summary>❌ $name</summary>"
              fi
              echo ""
              echo '```'
              cat "$pkg-output.txt"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $overall

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/shared/coverage
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: ignore
