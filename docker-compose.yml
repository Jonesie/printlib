# Standalone local run/dev. For production, run this same Dockerfile as a
# service in your own reverse-proxy stack (see README.md) instead of
# publishing port 8000 directly.
services:
  printlib:
    build: .
    image: printlib:local
    # Required: ADMIN_PASSWORD and SESSION_SECRET (plus optional Bluesky settings).
    # Copy apps/api/.env.example to apps/api/.env and edit it first.
    env_file: apps/api/.env
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
